# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

runtime: "container"

build:
  dockerfile: "Dockerfile"
  dockerBuildPath: "."

startCommand:
  type: http
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - clickupApiKey
      - clickupTeamId
    properties:
      clickupApiKey:
        type: string
        title: "ClickUp API Key"
        description: Your ClickUp API key.
      clickupTeamId:
        type: string
        title: "ClickUp Team ID"
        description: Your ClickUp Team ID.
  exampleConfig:
    clickupApiKey: "pk_123456789"
    clickupTeamId: "12345678"
